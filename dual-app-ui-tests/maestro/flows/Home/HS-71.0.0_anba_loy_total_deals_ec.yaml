# BUSINESS LOGIC: ANBA: Loyalty - Total Deals ExtraCare
# Validates: Loyalty Total Deals ExtraCare (anba_loy_total_deals_ec) displays for ExtraCare members
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Loyalty Total Deals ExtraCare ANBA displays in Activity module
#   - Shows available ExtraCare deals
#   - Provides deal count and savings information
#   - Call-to-action to browse deals

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - loyalty
    - extracare
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WERE_WORKING_ON_IT_NBA
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_loy_total_deals_ec}
- runFlow: ../../subflows/Shop/extracare/validate_rewards_screen.yaml
