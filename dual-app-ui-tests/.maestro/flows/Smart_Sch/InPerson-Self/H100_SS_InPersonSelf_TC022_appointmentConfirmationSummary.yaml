appId: ${APP_ID}
name: "H100 | Smart Scheduler | In-Person Self | TC022 - Appointment Confirmation Summary"
tags:
  - smart_scheduler
  - inperson
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
---
- runFlow:
    file: ../../../subflows/HAIO/navigation/navigate-to-haio_login_flow.yaml
    env:
      USER_NAME: LOA2

# Proceed through the full scheduling flow to reach confirmation summary
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need a MinuteClinic appointment for a flu evaluation. In-person mode near ZIP 75093"
- waitForAnimationToEnd

# Step 2: Select the best option
- assertVisible: "(?i).*(more than one|More than one|best|fits|pick|Pick).*"
- assertVisible: "(?i).*(Flu-like Symptoms Evaluation).*"
- tapOn: "(?i).*(Flu-like Symptoms Evaluation).*"
- waitForAnimationToEnd

- assertVisible: "(?i).*(Availability).*"
- assertVisible: "(?i).*(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday).*"
- tapOn:
    text: "(?i).*( AM| PM).*"
    index: 0
- waitForAnimationToEnd


# Verify confirmation summary screen content
- assertVisible: "(?i).*(Visit details|Confirm Visit).*"

- takeScreenshot: SS_TC022_Test_Complete
