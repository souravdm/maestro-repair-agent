# HAIO Intent: Benefit Landing - Single Session
# All benefit landing questions in one session with single login
# Updated: Dynamic keyword assertions per question type

appId: ${APP_ID}
name: "H100 | HAIO | TC007 - Intent Benefit Landing"
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript: ../../screens/HAIO/HomeScreen.js
  - runScript: ../../screens/HAIO/ChatScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: DEAN_FANT
        BUILD_CONFIG: ${BUILD_CONFIG}
---
# ============================================================================
# ONE-TIME SETUP - Login and navigate to HAIO
# ============================================================================
- waitForAnimationToEnd
- runFlow: ../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../subflows/Account/authentication/login.yaml
- runFlow: ../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Verify HAIO is ready
- assertVisible: ${output.haio_home.healthAssistantTitle}
- assertVisible: ${output.haio_home.chatInputField}

# ============================================================================
# BENEFIT LANDING INTENT - Questions with Dynamic Assertions
# ============================================================================

# Q1: What's my health plan?
- runFlow:
    file: ../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "What's my health plan?"
- runFlow:
    file: ../../subflows/HAIO/intents/verify-benefit-landing-response.yaml
    env:
      EXPECTED_KEYWORDS: "health plan|Aetna|coverage|Medical"

# Q2: What insurance do I have?
