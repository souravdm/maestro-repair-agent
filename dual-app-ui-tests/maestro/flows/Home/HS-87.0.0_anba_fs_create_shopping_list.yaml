# BUSINESS LOGIC: ANBA: Fulfillment Status - Create Shopping List
# Validates: Create Shopping List (anba_fs_create_shopping_list) displays for users
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Create Shopping List ANBA displays in Activity module
#   - Shows shopping list creation prompt
#   - Provides shopping list creation action
#   - Call-to-action to create list

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - fulfillment_status
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_fs_create_shopping_list}
