# BUSINESS LOGIC: Care Recommendations: Signed In View
# Validates: Care Recommendations section displays correctly for authenticated users
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Care Recommendations section visible after sign-in
#   - Personalized recommendations display for authenticated users
#   - Content updates based on user profile

appId: ${APP_ID}
tags:
    - homescreen
    - TLPCWHSAM-T10396
onFlowStart:
    - runScript: ../../screens/Common/CommonScreen.js
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjectsH100.js
    - runScript: ../../screens/SearchAndNav/searchNavObjects.js
    - runScript: ../../screens/Account/OnboardingScreen.js
    - runScript:
          file: ../../config/credentials-loader.js
          env:
              loginData: LOA2
---
- runFlow: ../../subflows/Common/launchApp.yaml
- runFlow: ../../subflows/Account/onboarding/h100_continue_to_sign_options.yaml
- runFlow: ../../subflows/Account/authentication/complete_signin_with_cvs_h100.yaml
- runFlow: ../../subflows/SearchAndNav/bottom_nav_loaded.yaml
- tapOn: ${output.searchnav_bottom.homeBtn}
- waitForAnimationToEnd
- runFlow: ../../subflows/Home/homescreen_loaded_successful_h100.yaml
- waitForAnimationToEnd
- runFlow: ../../subflows/Home/careRecommendations/validate_care_recommendations_displayed.yaml
