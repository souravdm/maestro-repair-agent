appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC141 - Neg Informational Query"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Informational question — should answer, not auto-book
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Can I get a flu shot at CVS?"
- waitForAnimationToEnd

# System should respond informatively
- assertVisible: "(?i).*(yes|flu shots.*available|CVS.*offer|MinuteClinic.*provides|You can get|available at).*"

# System must NOT start booking flow for an informational query
- assertNotVisible:
    text: "(?i).*(select a clinic|clinic.*near you|select date|confirm.*appointment).*"
    optional: true

- takeScreenshot: SS_TC141_Neg_Informational_No_Booking
