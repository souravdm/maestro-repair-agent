appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC150 - Virtual Uti Eligible"
tags:
  - smart_scheduler
  - modality_filter
  - nlp
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# UTI is telehealth-eligible — virtual options should be presented
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want a virtual visit for a UTI"
- waitForAnimationToEnd

- assertVisible: "(?i).*(virtual|telehealth|video.*visit|online.*visit|UTI|urinary).*"

# UTI is telehealth-eligible — must not show restriction
- assertNotVisible:
    text: "(?i).*(not available virtually|in-person only|cannot be treated virtually).*"
    optional: true

- takeScreenshot: SS_TC150_Modality_Virtual_UTI_Eligible
