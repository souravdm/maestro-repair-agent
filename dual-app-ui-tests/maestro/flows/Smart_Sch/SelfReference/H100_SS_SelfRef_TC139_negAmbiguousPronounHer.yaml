appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC139 - Neg Ambiguous Pronoun Her"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# 'her' = unidentified person — clarification required
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want to book for her"
- waitForAnimationToEnd

# Unresolved pronoun 'her' must trigger patient clarification
- assertVisible: "(?i).*(Who.*this.*for|which patient|select a patient|Who.*her|please.*clarify|who.*she).*"

- takeScreenshot: SS_TC139_Neg_Ambiguous_Pronoun_Her
