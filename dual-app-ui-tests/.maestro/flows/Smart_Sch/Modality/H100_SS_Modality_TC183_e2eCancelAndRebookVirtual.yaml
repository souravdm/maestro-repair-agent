appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC183 - E2e Cancel And Rebook Virtual"
tags:
  - smart_scheduler
  - e2e
  - modality_filter
  - cancellation
  - multi_turn
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Step 1: Cancel existing appointment
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Cancel my appointment"
- waitForAnimationToEnd

- assertVisible: "(?i).*(cancel|which appointment|upcoming|cancellation|confirm.*cancel).*"

# Step 2: Rebook with virtual modality and same reason for visit
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Book a new virtual appointment for the same issue"
- waitForAnimationToEnd

# System must start new virtual booking, ideally retaining the reason for visit
- assertVisible: "(?i).*(virtual|telehealth|video.*visit|new.*appointment|book.*new|same.*reason|I can help).*"

- takeScreenshot: SS_TC183_E2E_Cancel_And_Rebook_Virtual
