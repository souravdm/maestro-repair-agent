appId: ${APP_ID}
name: Discover Nba or Activity NBA Loaded
onFlowStart:
  - runScript: ../../screens/Home/homescreenObjects.js
---
- waitForAnimationToEnd
- scrollUntilVisible:
    direction: down
    element:
      text: ${output.homescreen_discover.discoverHeader} | ${output.homescreen_activity.activityHeader}
- assertVisible: 
    below:  ${output.homescreen_discover.discoverHeader} | ${output.homescreen_activity.activityHeader}