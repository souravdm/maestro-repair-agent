# Subflow: Verify Provider Search Intent Response
# Validates HAIO responds correctly to provider search questions
#
# Required env var (must be passed by caller):
#   EXPECTED_KEYWORDS - Pipe-separated keywords to verify
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Response guaranteed ready by send-message.yaml
- waitForAnimationToEnd

# Verify response contains expected keywords
- assertVisible: "(?i).*(${EXPECTED_KEYWORDS}).*"

# Capture HAIO chat screen for report
- takeScreenshot: HAIO_Provider_Search_Response
