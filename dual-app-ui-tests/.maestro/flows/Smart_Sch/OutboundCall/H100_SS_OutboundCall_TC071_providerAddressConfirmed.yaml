appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC071 - Provider Address Confirmed"
tags:
  - smart_scheduler
  - outbound_call
  - provider_search
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger provider search and selection to reach address confirmation step
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Find and select a provider for scheduling"
- waitForAnimationToEnd

# Verify that the provider's address on file is shown for user confirmation
- assertVisible:
    text: "(?i).*(address on file.*Confirm|Here's the address.*confirm.*different provider|Is this the right address|confirm.*address).*"
    optional: true
- takeScreenshot: SS_TC071_Provider_AddressConfirmed
