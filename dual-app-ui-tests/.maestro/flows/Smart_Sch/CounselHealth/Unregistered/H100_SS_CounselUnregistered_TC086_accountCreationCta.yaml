appId: ${APP_ID}
name: "H100 | Smart Scheduler | Counsel Health - Unregistered | TC086 - Account Creation Cta"
tags:
  - smart_scheduler
  - counsel_health
  - webview
  - positive
onFlowStart:
  - runScript: ../../../../screens/Common/CommonScreen.js
  - runScript: ../../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../../screens/Smart_Sch/CounselHealthScreen.js
  - runScript:
      file: ../../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Send message requesting account creation
- runFlow:
    file: ../../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Create a Counsel Health account"
- waitForAnimationToEnd

# Handle legal modal before WebView
- runFlow: ../../../../subflows/Smart_Sch/counsel/handle-legal-modal.yaml

# Verify account creation CTA is visible in the WebView
- assertVisible: "Create an account"

- takeScreenshot: SS_TC086_Account_Creation
