appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC068 - Provider Search Invalid State"
tags:
  - smart_scheduler
  - outbound_call
  - provider_search
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Provide an invalid US state abbreviation to trigger validation error
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Find a doctor in ZZZ"
- waitForAnimationToEnd

# Verify that the invalid state input is rejected with a helpful error message
- assertVisible: "(?i).*(don't recognize.*US state|ZZZ.*not a.*state|Enter the state again|invalid.*state|not a valid state|state.*not recognized).*"
- takeScreenshot: SS_TC068_ProviderSearch_InvalidState
