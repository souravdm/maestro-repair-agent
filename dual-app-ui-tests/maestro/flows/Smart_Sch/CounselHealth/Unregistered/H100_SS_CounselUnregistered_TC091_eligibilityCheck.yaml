appId: ${APP_ID}
name: "H100 | Smart Scheduler | Counsel Health - Unregistered | TC091 - Eligibility Check"
tags:
  - smart_scheduler
  - counsel_health
  - eligibility
  - edge_case
onFlowStart:
  - runScript: ../../../../screens/Common/CommonScreen.js
  - runScript: ../../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../../screens/Smart_Sch/CounselHealthScreen.js
  - runScript:
      file: ../../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Ask about Counsel Health eligibility
- runFlow:
    file: ../../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Am I eligible for Counsel Health mental health chat?"
- waitForAnimationToEnd

# Verify response confirms eligibility status (either eligible or not eligible with alternatives)
- assertVisible: "(?i).*(eligible|subscription|Counsel.*available|physician.*chat|not eligible|not available|alternative).*"

- takeScreenshot: SS_TC091_Eligibility_Check
