appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC161 - Neg No Filter All Shown"
tags:
  - smart_scheduler
  - modality_filter
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# No modality keyword — all options should be presented
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need to see a doctor for my sore throat"
- waitForAnimationToEnd

# Multiple modalities should appear without any filter applied
- assertVisible: "(?i).*(virtual|in-person|MinuteClinic|video|telehealth|clinic).*"

- takeScreenshot: SS_TC161_Modality_Neg_No_Filter_All_Shown
