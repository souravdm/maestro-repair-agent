# Subflow: Verify Prescription Intent Response
# Validates HAIO responds with relevant prescription/pharmacy information
#
# Required env vars (must be passed by caller):
#   SCENARIO_NAME   - Unique name for screenshot (e.g., "Rx_RefillStatus")
#   EXPECTED_KEYWORDS - Pipe-separated keywords to verify in bot response
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Bot response already ready (send-message.yaml waited for typing indicator)
- waitForAnimationToEnd

# Capture chat screen BEFORE assertions for failure diagnosis
- takeScreenshot: HAIO_Prescription_${SCENARIO_NAME}_Response

# Verify response contains prescription-relevant keywords
- assertVisible: "(?i).*(${EXPECTED_KEYWORDS}).*"

# Ensure no PHI leak — bot should not expose raw member IDs or SSNs
- assertNotVisible: "(?i).*(ssn|social security|credit card|cvv).*"
