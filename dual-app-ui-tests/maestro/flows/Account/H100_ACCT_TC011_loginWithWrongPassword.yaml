# Test: Invalid Login
# Validates error handling for invalid login attempts
# Tests both invalid email format and wrong password scenarios

appId: ${APP_ID}
name: "H100 | Account | TC011 - Login With Wrong Password"
tags:
  - account
  - authentication
  - validation
  - regression
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript: ../../screens/Account/LoginScreen.js
  - runScript: ../../screens/Common/SystemPermissionsScreen.js
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

# Navigate to Sign In
- tapOn: ${output.common_navigation.accountBtn}
- waitForAnimationToEnd
- assertVisible: ${output.common_buttons.signInBtn}

# Tap Sign In button
- tapOn:
    text: ${output.common_buttons.signInBtn}
- waitForAnimationToEnd

# Wait for login screen to load
- assertVisible: ${output.account_login.emailField}

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

# Enter invalid email format
- tapOn:
    text: ${output.account_login.emailField}
- inputText: "invalid@email"
- waitForAnimationToEnd
- tapOn: ${output.common_buttons.continueBtn}
- waitForAnimationToEnd

# Verify error message for invalid email
- assertVisible:
    text: ".*valid email.*|.*Enter a valid email.*"

# Handle any error overlay dialogs
- runFlow:
    when:
      visible: ${output.common_overlays.errorVisiblePattern}
    commands:
      - tapOn:
          text: ${output.common_overlays.errorDismissPattern}
          optional: true

# Clear and enter valid email with wrong password
- tapOn:
    text: ${output.account_login.emailField}
- waitForAnimationToEnd
- eraseText
- waitForAnimationToEnd
- inputText: "invalid@email.com"
- waitForAnimationToEnd
- tapOn: ${output.common_buttons.continueBtn}
- waitForAnimationToEnd

# Wait for password screen or error
- assertVisible: "${output.account_login.passwordField}|Error|Invalid"

# Handle password screen if reached
- runFlow:
    when:
      visible: ${output.account_login.passwordField}
    commands:
      - tapOn:
          text: ${output.account_login.passwordField}
      - inputText: "WrongPassword123!"
      - tapOn: ${output.account_login.signInBtn}

# Verify error message for invalid password
- assertVisible:
    text: ".*password.*incorrect.*|.*try again.*|.*invalid.*|.*Error.*"

# Handle any error dialogs after failed login
- runFlow:
    when:
      visible: ${output.common_overlays.errorVisiblePattern}
    commands:
      - tapOn:
          text: ${output.common_overlays.errorDismissPattern}
          optional: true

# Verify we're still on login screen
- assertVisible:
    text: "Sign in|Mobile number or email|Password"
