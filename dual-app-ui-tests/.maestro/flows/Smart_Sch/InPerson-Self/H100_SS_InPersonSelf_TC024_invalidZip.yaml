appId: ${APP_ID}
name: "H100 | Smart Scheduler | In-Person Self | TC024 - Invalid Zip"
tags:
  - smart_scheduler
  - inperson
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
---

- runFlow:
    file: ../../../subflows/HAIO/navigation/navigate-to-haio_login_flow.yaml
    env:
      USER_NAME: LOA2

# Submit a non-numeric ZIP code that should fail validation
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I am looking to book an appointment for myself for my pink eye issue. In-person mode."
- waitForAnimationToEnd

- runFlow:
    when:
      visible: "(?i).*(match|more|than|one).*"
    commands:
      - assertVisible: "(?i).*(Pink Eye Treatment).*"
      - tapOn: "(?i).*(Pink Eye Treatment).*"
      - waitForAnimationToEnd

- assertVisible: "(?i).*(Where|from|location).*"

- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "00000"
- waitForAnimationToEnd

# System should reject the invalid ZIP and prompt for a valid location
- assertVisible: "(?i).*(not finding|updating|preferences|isn't recognized|zip code).*"

- takeScreenshot: SS_TC024_Invalid_ZIP_Error
