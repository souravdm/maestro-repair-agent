# BUSINESS LOGIC: ANBA: Priority - Not Filled
# Validates: Not filled prescription anba_rx_notrefilled displays with correct action
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Not filled status NBA appears
#   - Correct action text displays
#   - NBA is priority (appears first)
#   - Tap action navigates correctly

appId: ${APP_ID}
tags:
    - homescreen
    - ignore
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: DOBBY_BOOK
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
    file: ../../subflows/Home/click_anba_card.yaml
    env:
        ANBA_CARD: ${output.homescreen_activity.pnba_notFilled}
- runFlow: ../../subflows/Pharmacy/validate_not_filled_rx.yaml