# BUSINESS LOGIC: ANBA: Rx Status - Caregiving Approval
# Validates: Rx Caregiving Approval (anba_rx_caregiving_approval) displays for caregivers with pending approvals
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Rx Caregiving Approval ANBA displays in Activity module
#   - Shows caregiving approval notifications
#   - Provides approval status
#   - Call-to-action for approval action

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - rx_status
    - caregiving
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2_CAREGIVER
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_rx_caregiving_approval}
