# NBA / Benefits Coverage Config
#
# Lists the ANBA/DNBA card IDs and benefit/profile flags we expect to see returned
# by the Personalization Engine (and friends) somewhere across the full test-data
# user pool for each app. Coverage is checked as a UNION across all users in a run
# (not per-user), because NBA presence is dynamic (Rx status, expiration windows,
# segment, etc.) and no single user is guaranteed to trigger every card.
#
# IDs are seeded from:
#   - real nbaCardId / dnba.id values observed in artifacts/api/tests/test-data-report-*/test-data.json
#   - anba_* / dnba_* keys referenced in .maestro/screens/Home/homescreenObjects.js
#     and homescreenObjectsH100.js
#
# Update this file whenever a new card is added to AEM/homescreenObjects and you want
# CI to flag if the test-data user pool never actually exercises it.

