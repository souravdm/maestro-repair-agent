# BUSINESS LOGIC: Discovery Zone expected Discovery NBAs
# Validates: Discovery Zone Loads ExtraCare plus Discovery NBAs
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Discovery zone header visible
#   - Discovery NBAs load from Personalization Engine
#   - Extracare Plus DNBA is displayed
#   - Extracare Plus DNBA is tappable and navigable

appId: ${APP_ID}
tags:
    - homescreen
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2_CAREGIVER
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- tapOn: ${output.homescreen_splitview.tab_shop}
- runFlow:
    file: ../../subflows/Home/click_dnba_card.yaml
    env:
      DNBA_CARD_TITLE: ${output.homescreen_discover.freeSameDayDelivery}
- assertVisible: "CVS.*"