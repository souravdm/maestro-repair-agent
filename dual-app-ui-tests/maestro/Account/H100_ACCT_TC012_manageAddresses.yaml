# Test: Manage Addresses
# Validates address management page
# Source: Migrated from XCUITest AddressesTabTests

appId: ${APP_ID}
name: "H100 | Account | TC012 - Manage Addresses"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/addresses.yaml

- runScript: ../../screens/Account/AddressesScreen.js
- assertVisible: ${output.account_addresses.addressesNavBar}
