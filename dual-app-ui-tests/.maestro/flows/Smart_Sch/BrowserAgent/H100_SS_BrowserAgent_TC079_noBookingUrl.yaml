appId: ${APP_ID}
name: "H100 | Smart Scheduler | Browser Agent | TC079 - No Booking Url"
tags:
  - smart_scheduler
  - browser_agent
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Request online scheduling for a provider that has no booking URL configured
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Schedule online with this provider"
- waitForAnimationToEnd

# Verify that missing booking URL is communicated with fallback guidance
- assertVisible:
    text: "(?i).*(couldn't find.*scheduling link|no scheduling link|scheduling link.*provider|booking link.*not found|no online scheduling).*"
    optional: true
- takeScreenshot: SS_TC079_BrowserAgent_NoBookingUrl
