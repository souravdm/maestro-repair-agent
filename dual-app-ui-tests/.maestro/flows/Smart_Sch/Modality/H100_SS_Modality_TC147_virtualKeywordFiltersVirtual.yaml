appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC147 - Virtual Keyword Filters Virtual"
tags:
  - smart_scheduler
  - modality_filter
  - nlp
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Explicit 'virtual' keyword — must filter to virtual-only options
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want a virtual visit for my sore throat"
- waitForAnimationToEnd

# Virtual options must be shown
- assertVisible: "(?i).*(virtual|telehealth|video.*visit|online.*visit|MinuteClinic.*video).*"

# In-person options must NOT appear after virtual filter
- assertNotVisible:
    text: "(?i).*(in-person|walk-in|clinic.*location|physical.*location|face-to-face).*"
    optional: true

- takeScreenshot: SS_TC147_Modality_Virtual_Keyword_Filter
