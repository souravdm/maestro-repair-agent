appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC180 - E2e Session Reset No Stale Context"
tags:
  - smart_scheduler
  - e2e
  - modality_filter
  - edge_case
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Step 1: Apply virtual filter
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need a virtual visit for my cold"
- waitForAnimationToEnd

- assertVisible: "(?i).*(virtual|telehealth|video.*visit).*"

# Simulate session reset by relaunching the app
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Step 2: Fresh session — all options should appear, no virtual filter stale
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Show me my appointment options"
- waitForAnimationToEnd

# After session reset, all modalities should be available — no stale virtual filter
- assertVisible: "(?i).*(virtual|in-person|MinuteClinic|telehealth|clinic).*"

- takeScreenshot: SS_TC180_E2E_Session_Reset_No_Stale_Context
