# Subflow: Verify OTC & Supplements Intent Response
# Validates HAIO responds with accurate guidance on over-the-counter medications,
# supplement safety, FSA eligibility, and brand vs. generic differences
#
# Required env vars (must be passed by caller):
#   SCENARIO_NAME   - Unique name for screenshot (e.g., "OTC_PainRelief")
#   EXPECTED_KEYWORDS - Pipe-separated keywords to verify in bot response
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Bot response already ready (send-message.yaml waited for typing indicator)
- waitForAnimationToEnd

# Capture chat screen BEFORE assertions for failure diagnosis
- takeScreenshot: HAIO_OTCSupplements_${SCENARIO_NAME}_Response

# Verify response contains OTC/supplement-relevant keywords
- assertVisible: "(?i).*(${EXPECTED_KEYWORDS}).*"

# Ensure no raw PHI identifiers are exposed
- assertNotVisible: "(?i).*(ssn|social security|credit card|cvv).*"
