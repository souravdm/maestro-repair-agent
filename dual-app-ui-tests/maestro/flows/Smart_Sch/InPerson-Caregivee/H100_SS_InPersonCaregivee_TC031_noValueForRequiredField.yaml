appId: ${APP_ID}
name: "H100 | Smart Scheduler | In-Person Caregivee | TC031 - No Value For Required Field"
tags:
  - smart_scheduler
  - caregivee
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Initiate patient details collection
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Schedule a visit for a patient"
- waitForAnimationToEnd

# Wait for a required field prompt (name, DOB, or other)
- assertVisible: "(?i).*(patient.s name|date of birth|gender|What is the patient).*"

# Submit empty/blank to simulate skipping a required field
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: " "
- waitForAnimationToEnd

# System should display a required-field error
- assertVisible: "(?i).*(No value was provided|This field is required|Try again|Please provide|can.t be empty|enter.*value).*"

- takeScreenshot: SS_TC031_No_Value_Required_Field_Error
