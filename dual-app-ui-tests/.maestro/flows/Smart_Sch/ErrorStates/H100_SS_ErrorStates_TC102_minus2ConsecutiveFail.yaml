appId: ${APP_ID}
name: "H100 | Smart Scheduler | Error States | TC102 - Minus2 Consecutive Fail"
tags:
  - smart_scheduler
  - error_states
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Attempt a retry to simulate consecutive failure scenario
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Try again to schedule"
- waitForAnimationToEnd

# Error -2 after retry: "I still wasn't able to load any results."
# Verify consecutive failure final message (optional - requires specific error state)
- assertVisible:
    text: "(?i).*(still wasn't able to load|still.*no results|You can still find care.*scheduling tool).*"
    optional: true

# Verify NBA card persists as fallback for the user (optional)
- assertVisible:
    text: "(?i).*(Find care with scheduling tool).*"
    optional: true

- takeScreenshot: SS_TC102_Error_Consecutive
