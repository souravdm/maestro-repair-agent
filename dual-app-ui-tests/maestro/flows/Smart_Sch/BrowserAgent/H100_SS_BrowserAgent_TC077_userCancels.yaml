appId: ${APP_ID}
name: "H100 | Smart Scheduler | Browser Agent | TC077 - User Cancels"
tags:
  - smart_scheduler
  - browser_agent
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Request booking then signal cancellation to exercise cancel handling
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Book an appointment then cancel it"
- waitForAnimationToEnd

# Verify cancellation acknowledgment and no-appointment confirmation
- assertVisible:
    text: "(?i).*(canceled scheduling|I canceled scheduling|No appointment was made|scheduling.*canceled|cancelled.*booking).*"
    optional: true
- takeScreenshot: SS_TC077_BrowserAgent_UserCancels
