appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC172 - E2e Self Virtual Full Flow"
tags:
  - smart_scheduler
  - e2e
  - self_reference
  - modality_filter
  - virtual
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# E2E: Self-reference + virtual modality — full scheduling flow
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need a virtual visit for my cold"
- waitForAnimationToEnd

# Self resolved — no patient selection prompt
- assertNotVisible:
    text: "(?i).*(select a patient|Who is this.*for|which patient).*"
    optional: true

# Virtual filter applied
- assertVisible: "(?i).*(virtual|telehealth|video.*visit|online.*visit).*"

- assertNotVisible:
    text: "(?i).*(in-person|walk-in|clinic.*location).*"
    optional: true

- takeScreenshot: SS_TC172_E2E_Self_Virtual_Full_Flow
