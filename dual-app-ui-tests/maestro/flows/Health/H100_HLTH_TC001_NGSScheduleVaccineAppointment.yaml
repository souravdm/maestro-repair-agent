appId: ${APP_ID}
name: "H100 | Health | TC001 - Ngs Schedule Vaccine Appointment"
tags:
  - ngs
  - vaccine
  - scheduling
  - smoke
---
- runFlow: ../../subflows/Common/launchAndSetup.yaml
# Load screen files (POM) - defines all locators
- runScript: ../../screens/Common/CommonScreen.js
- runScript: ../../screens/Health/MinuteClinicSchedulingScreen.js
- runScript: ../../screens/Health/HealthScreen.js

# Test: Start Vaccine Scheduling Flow

# Wait for app to load
- assertVisible: ${HOME_TAB}

- assertVisible: ${HOME_TAB}

# Navigate to Vaccines
- tapOn: ${HOME_TAB}
- tapOn: ${VACCINES_LNK}
- assertVisible: ${FIND_CARE_TITLE}

# Verify vaccine scheduler elements
- assertVisible: ${SCHEDULE_VACCINATION_BTN}
- tapOn: ${SCHEDULE_VACCINATION_BTN}
- assertVisible: ${SCHEDULE_VACCINE_MSG}

# Verify vaccine types available
- assertVisible:
    text: ".*COVID.*|.*Flu.*|.*vaccine.*"
