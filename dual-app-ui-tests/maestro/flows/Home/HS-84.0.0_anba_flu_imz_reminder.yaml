# BUSINESS LOGIC: ANBA: Health Services - Flu Reminder
# Validates: Flu Reminder (anba_flu_imz_reminder) displays for users needing flu vaccine
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Flu Reminder ANBA displays in Activity module
#   - Shows flu vaccine reminder notifications
#   - Provides flu vaccine information
#   - Call-to-action for flu vaccine scheduling

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - health_services
    - immunization
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: PEACH_BLOSSOM
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_flu_imz_reminder}
