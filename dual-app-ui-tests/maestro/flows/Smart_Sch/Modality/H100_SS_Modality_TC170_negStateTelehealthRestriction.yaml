appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC170 - Neg State Telehealth Restriction"
tags:
  - smart_scheduler
  - modality_filter
  - nlp
  - negative
  - edge_case
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Virtual request — system should surface any state telehealth restrictions
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want a virtual visit"
- waitForAnimationToEnd

# System must either show virtual options or surface state restriction if applicable
- assertVisible: "(?i).*(virtual|telehealth|video.*visit|state.*restriction|not.*available.*state|available.*your.*state|licensed.*state).*"

- takeScreenshot: SS_TC170_Modality_Neg_State_Telehealth_Restriction
