# BUSINESS LOGIC: ANBA: Fulfillment Status - Ready for Pickup
# Validates: Fulfillment Status Ready (anba_fs_ready) displays for users with ready orders
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Fulfillment Status Ready ANBA displays in Activity module
#   - Shows ready for pickup notifications
#   - Provides pickup location information
#   - Call-to-action for pickup details

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - fulfillment_status
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_fs_ready}
