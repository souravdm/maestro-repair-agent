# Subflow: Verify Enrollment & Plan Change Intent Response
# Validates HAIO responds correctly to open enrollment, QLE, and plan comparison questions
#
# Required env vars (must be passed by caller):
#   SCENARIO_NAME   - Unique name for screenshot (e.g., "Enrollment_OpenEnrollment")
#   EXPECTED_KEYWORDS - Pipe-separated keywords to verify in bot response
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Bot response already ready (send-message.yaml waited for typing indicator)
- waitForAnimationToEnd

# Capture chat screen BEFORE assertions for failure diagnosis
- takeScreenshot: HAIO_Enrollment_${SCENARIO_NAME}_Response

# Verify response contains enrollment-relevant keywords
- assertVisible: "(?i).*(${EXPECTED_KEYWORDS}).*"

# Ensure no raw member identifiers are exposed
- assertNotVisible: "(?i).*(ssn|social security|credit card|cvv).*"
