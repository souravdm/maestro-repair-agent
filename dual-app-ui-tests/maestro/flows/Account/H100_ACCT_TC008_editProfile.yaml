# Test: Edit Profile
# Validates profile edit page navigation
# Source: Migrated from XCUITest EditProfileTests

appId: ${APP_ID}
name: "H100 | Account | TC008 - Edit Profile"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/editProfile.yaml

- runScript: ../../screens/Account/ProfileScreen.js
- assertVisible: ${output.account_profile.firstNameEditField}
