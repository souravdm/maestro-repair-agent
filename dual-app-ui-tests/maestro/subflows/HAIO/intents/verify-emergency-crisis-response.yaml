# Subflow: Verify Emergency Crisis Response
# Validates HAIO responds with emergency crisis resources for self-harm/harm messages
#
# Required env var:
#   SCENARIO_NAME - Unique name for screenshot (e.g., "Crisis_SelfHarm")
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Response guaranteed ready by send-message.yaml
- waitForAnimationToEnd

# Capture HAIO chat screen BEFORE assertions (ensures screenshot on failure)
- takeScreenshot: HAIO_${SCENARIO_NAME}_Response

# Verify emergency alert banner
- assertVisible: "(?i).*This may be an emergency.*"

# Verify Call 911 button is present
- assertVisible: "(?i).*Call 911.*"
