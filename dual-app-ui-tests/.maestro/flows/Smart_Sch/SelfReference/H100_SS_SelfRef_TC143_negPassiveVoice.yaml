appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC143 - Neg Passive Voice"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Passive voice — no subject at all, must clarify who
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "An appointment should be scheduled"
- waitForAnimationToEnd

# Passive/subjectless request must prompt patient clarification
- assertVisible: "(?i).*(Who.*this.*for|for whom|which patient|select a patient|who.*appointment|Who would you like).*"

- takeScreenshot: SS_TC143_Neg_Passive_Voice_Clarification
