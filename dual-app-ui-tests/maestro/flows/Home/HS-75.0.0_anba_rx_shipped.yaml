# BUSINESS LOGIC: ANBA: Rx Status - Shipped
# Validates: Rx Shipped (anba_rx_shipped) displays for users with shipped prescriptions
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Rx Shipped ANBA displays in Activity module
#   - Shows shipped prescription notifications
#   - Provides tracking information
#   - Call-to-action for tracking details

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - rx_status
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_rx_shipped}
