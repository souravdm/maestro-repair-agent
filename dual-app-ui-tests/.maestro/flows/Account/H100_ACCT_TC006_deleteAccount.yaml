# Test: Delete Account Flow
# Validates delete account navigation
# Source: Migrated from XCUITest DeleteAccountTests

appId: ${APP_ID}
name: "H100 | Account | TC006 - Delete Account"
tags:
  - account
  - critical
  - migrated-xcuitest
onFlowStart:
