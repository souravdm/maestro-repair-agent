# BUSINESS LOGIC: ANBA: Health Services - Upcoming Immunization
# Validates: Upcoming Immunization (anba_hs_upcomingimz) displays for users with scheduled vaccines
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Upcoming Immunization ANBA displays in Activity module
#   - Shows upcoming vaccine notifications
#   - Provides vaccine details
#   - Call-to-action for vaccine scheduling

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - health_services
    - immunization
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_hs_upcomingimz}
