appId: ${APP_ID}
name: "H100 | Smart Scheduler | Error States | TC105 - Browser Agent Confirm Failure"
tags:
  - smart_scheduler
  - error_states
  - browser_agent
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript: ../../../screens/Smart_Sch/AppointmentConfirmationScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Attempt to book an appointment via Browser Agent (may trigger confirmation failure)
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Book an appointment"
- waitForAnimationToEnd

# Verify confirmation failure error message is gracefully shown (optional - requires specific failure condition)
- assertVisible:
    text: "(?i).*(having trouble confirming.*appointment|trouble.*confirming|Want to try again).*"
    optional: true

- takeScreenshot: SS_TC105_Confirm_Failure
