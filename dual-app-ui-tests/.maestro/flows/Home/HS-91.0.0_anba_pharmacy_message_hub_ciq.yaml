# BUSINESS LOGIC: ANBA: Pharmacy - Message Hub
# Validates: Pharmacy Message Hub (anba_pharmacy_message_hub_ciq) displays for users
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Pharmacy Message Hub ANBA displays in Activity module
#   - Shows pharmacy message hub option
#   - Provides message hub access
#   - Call-to-action to access messages

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - pharmacy
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_pharmacy_message_hub_ciq}
