appId: ${APP_ID}
name: "H100 | Menu | TC015 - Login Rx Orders"
tags:
  - home
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/SearchAndNav/searchNavObjects.js
  - runScript: ../../screens/Menu/MenuScreen.js
---
# Flow: Menu navigation and verification for Rx orders
- runFlow: ../../subflows/Common/launchAndSetup.yaml
- runScript:
    file: ../../config/credentials-loader.js
    env:
      loginData: DEAN_FANT
      BUILD_CONFIG: ${BUILD_CONFIG}
- runFlow:
    file: ../../subflows/Account/authentication/login.yaml

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml

- takeScreenshot: Menu_Pic
- scrollUntilVisible:
    element: ${output.explore_more_menu.rxOrdersBtn}
    speed: 40
- assertVisible: ${output.explore_more_menu.rxOrdersBtn}
- tapOn: ${output.explore_more_menu.rxOrdersBtn}
- assertVisible: ${output.searchnav_bottom_pharmacy.orders}


- takeScreenshot: Test_complete

