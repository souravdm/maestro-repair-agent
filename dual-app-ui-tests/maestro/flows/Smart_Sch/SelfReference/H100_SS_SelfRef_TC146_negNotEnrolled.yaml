appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC146 - Neg Not Enrolled"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - negative
  - edge_case
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Unauthenticated or restricted user — system must handle gracefully
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need to see a doctor"
- waitForAnimationToEnd

# Authenticated LOA2 user should be able to proceed with scheduling
- assertVisible: "(?i).*(schedule|clinic|help.*you|What.*reason|How can I help|I can help).*"

- takeScreenshot: SS_TC146_Neg_Not_Enrolled_Handling
