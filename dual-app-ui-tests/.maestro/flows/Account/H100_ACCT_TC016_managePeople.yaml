# Test: Manage People
# Validates manage people page navigation
# Source: Migrated from XCUITest ManagePeopleTests

appId: ${APP_ID}
name: "H100 | Account | TC016 - Manage People"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/managePeople.yaml

- runScript: ../../screens/Account/ManagePeopleScreen.js
- assertVisible: ${output.account_managePeople.managePeopleNavBar}
