appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC065 - Provider Search By Name"
tags:
  - smart_scheduler
  - outbound_call
  - provider_search
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Search for a specific provider by name and specialty
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Find Dr. Smith cardiologist"
- waitForAnimationToEnd

# Verify provider search results are shown with selection prompt
- assertVisible: "(?i).*(best matches.*select|Here are the best matches|found.*providers|select.*continue|matching providers).*"
- takeScreenshot: SS_TC065_ProviderSearch_ByName
