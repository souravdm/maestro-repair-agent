appId: ${APP_ID}
name: "H100 | Smart Scheduler | MinuteClinic Async | TC046 - Prescreen Q3"
tags:
  - smart_scheduler
  - mc_async
  - prescreen
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/MCAsyncScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger MC Async acne flow for description question
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Get async acne treatment"
- waitForAnimationToEnd

# Verify third prescreen question asking for acne description
- assertVisible: "(?i).*(Tell us more about your acne|more about.*acne|Describe your acne).*"
- takeScreenshot: SS_TC046_MCAsync_PrescreenQ3_Description
