# BUSINESS LOGIC: Health Services Flu Shot Navigation
# Validates: User can navigate to Flu Shot from Health Services module
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Flu Shot option available in Health Services
#   - Navigation to Flu Shot works correctly
#   - Flu Shot screen loads successfully
#   - Back navigation returns to homescreen

appId: ${APP_ID}
tags:
    - homescreen
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- tapOn: ${output.account_signIn.continueAsGuestBtn}
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- tapOn: ${output.homescreen_splitview.tab_health_and_pharmacy}
- runFlow:
      file: "../../subflows/Home/bu_module_displayed.yaml"
      env:
          BU_MODULE_HEADER: ${output.homescreen_healthServices.healthServices}
- scrollUntilVisible:
      element:
          text: ${output.homescreen_healthServices.scheduleFluShot}
      speed: 15
- tapOn: ${output.homescreen_healthServices.scheduleFluShot}
- extendedWaitUntil:
    visible: "Schedule care"
    timeout: 15000