appId: ${APP_ID}
name: "H100 | Smart Scheduler | Counsel Health - Registered | TC092 - User Message"
tags:
  - smart_scheduler
  - counsel_health
  - registered
  - post_mvp
onFlowStart:
  - runScript: ../../../../screens/Common/CommonScreen.js
  - runScript: ../../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../../screens/Smart_Sch/CounselHealthScreen.js
  - runScript:
      file: ../../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Post-MVP feature: Registered/subscribed user flow. Figma annotation: 'Post MVP?'
# Send message as a user who already has a Counsel Health subscription
- runFlow:
    file: ../../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want to use my Counsel Health subscription"
- waitForAnimationToEnd

# Verify the response confirms existing subscription and continues to physician chat
- assertVisible: "(?i).*(already have a subscription.*chat.*physician|subscription.*physician.*continue|Sounds good.*subscription).*"

- takeScreenshot: SS_TC092_Registered_Message
