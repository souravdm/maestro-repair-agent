# Subflow: Switch to Medical Tab
# Purpose: Navigate to Medical tab in Benefits landing page
# Prerequisite: Must be on Benefits landing page with Medical tab visible
appId: ${APP_ID}
---
- runScript: ../../../screens/Common/CommonScreen.js
- runScript: ../../../screens/Benefits/BenefitsDashboardScreen.js

# Scroll back to top so the tab bar is in view before tapping
- scrollUntilVisible:
    element:
      text: ${output.benefits_landing.medicalTab}
    direction: UP

# Tap Medical tab
- tapOn: ${output.benefits_landing.medicalTab}
- waitForAnimationToEnd

# Verify Medical tab is selected
- assertVisible: ${output.benefits_landing.medicalTab}

# Verify Medical-specific content
- runFlow:
    when:
      visible: ${output.benefits_landing.medicalSpendingBtn}
    commands:
      - assertVisible: ${output.benefits_landing.medicalSpendingBtn}
