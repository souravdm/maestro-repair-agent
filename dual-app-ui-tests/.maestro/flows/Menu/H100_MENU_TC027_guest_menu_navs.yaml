appId: ${APP_ID}
name: "H100 | Menu | TC027 - Guest Menu Navs"
tags:
  - guestMenu
  - smoke
  - H100
onFlowStart:
  - runScript: ../../screens/SearchAndNav/searchNavObjects.js
---

- runFlow: ../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../subflows/Account/continue_as_guest_h100.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful_h100.yaml
- waitForAnimationToEnd
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml
- waitForAnimationToEnd
- takeScreenshot: Menu_Pic

# Checking menu items — part 1 of 2 (split across two opens: guest menu auto-closes after ~3 checks)
- assertVisible: ${output.menu_screen.healthRecordsLnk}
- tapOn:
    text: ${output.menu_screen.closeMenuBtn}
    optional: true
- waitForAnimationToEnd

# Checking menu items — part 2 of 2
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ${output.menu_screen.helpCenterLnk}
    speed: 40
- assertVisible: ${output.menu_screen.helpCenterLnk}
- assertVisible: ${output.explore_more_menu.copyDeviceInf}
- tapOn:
    text: ${output.menu_screen.closeMenuBtn}
    optional: true
- waitForAnimationToEnd

# Terms and policy (own menu open — 4th assertion in same open would trigger auto-close)
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ${output.menu_screen.termsAndPrivacyLnk}
    speed: 40
- assertVisible: ${output.menu_screen.termsAndPrivacyLnk}
- tapOn: ${output.menu_screen.termsAndPrivacyLnk}
- waitForAnimationToEnd
- takeScreenshot: Test_screen
- assertVisible: ${output.explore_more_menu.termsAndPrivacyBtn}
- assertVisible: ${output.explore_more_menu.termsOfUse}
- assertVisible: ${output.explore_more_menu.privacyPolicy}
- assertVisible: ${output.explore_more_menu.personalHealth}
- takeScreenshot: Menu_Terms_Policy
- tapOn: "Back"
- waitForAnimationToEnd

- runFlow: ../../subflows/Menu/navigateViaMenu.yaml
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ${output.menu_screen.menuOpenBtn}
    commands:
      - tapOn:
          text: "Show Menu"
      - waitForAnimationToEnd

# Help Center (formerly Support and FAQ)
- scrollUntilVisible:
    element: ${output.menu_screen.helpCenterLnk}
    speed: 40
- assertVisible: ${output.menu_screen.helpCenterLnk}
- tapOn: ${output.menu_screen.helpCenterLnk}
- waitForAnimationToEnd
- takeScreenshot: Support_and_FAQ
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
      - waitForAnimationToEnd
- assertVisible: ${output.search_help_center.howCanWeHelpTitle}
- tapOn: "Back"
- waitForAnimationToEnd

- runFlow: ../../subflows/Menu/navigateViaMenu.yaml
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ${output.menu_screen.menuOpenBtn}
    commands:
      - tapOn:
          text: "Show Menu"
      - waitForAnimationToEnd

# Health records
- assertVisible: ${output.menu_screen.healthRecordsLnk}
- tapOn: ${output.menu_screen.healthRecordsLnk}
- waitForAnimationToEnd
- assertVisible: ${output.account_health100_onboarding.signInOrCreateTitle}
- assertVisible: ${output.common_buttons.maybeLaterBtn}

- takeScreenshot: Test_complete

