appId: ${APP_ID}
name: Navigate to Chat History
tags:
  - haio
  - preferences
  - chat-history
---
# Load screen objects
- runScript: ../../../screens/HAIO/PreferencesScreen.js

# Assumes user is on preferences main screen
# Tap Chat & search history option
- tapOn: ${output.haio_preferences.chatHistoryOption}
- waitForAnimationToEnd

# Verify chat history screen loaded
- assertVisible: ${output.haio_preferences.chatHistoryTitle}
- assertVisible: ${output.haio_preferences.searchChatsField}
