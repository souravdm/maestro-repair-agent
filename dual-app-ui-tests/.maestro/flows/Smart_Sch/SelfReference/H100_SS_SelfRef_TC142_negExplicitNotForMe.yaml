appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC142 - Neg Explicit Not For Me"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Explicit 'not for me' — must ask who the appointment is for
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need an appointment but not for me"
- waitForAnimationToEnd

# Explicit denial of self-reference must prompt patient clarification
- assertVisible: "(?i).*(Who.*this.*for|which patient|select a patient|for whom|who.*appointment.*for).*"

- assertNotVisible:
    text: "(?i).*(scheduling.*for you|your appointment).*"
    optional: true

- takeScreenshot: SS_TC142_Neg_Explicit_Not_For_Me
