# BUSINESS LOGIC: ANBA: Loyalty - HIPAA Reconsent
# Validates: Loyalty HIPAA Reconsent (anba_loy_hipaareconsent) displays for users needing reconsent
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Loyalty HIPAA Reconsent ANBA displays in Activity module
#   - Shows HIPAA reconsent request
#   - Provides reconsent action
#   - Call-to-action to complete reconsent

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - loyalty
    - hipaa
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WERE_WORKING_ON_IT_NBA
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_loy_hipaareconsent}
- runFlow: ../../subflows/Shop/extracare/validate_rewards_screen.yaml
