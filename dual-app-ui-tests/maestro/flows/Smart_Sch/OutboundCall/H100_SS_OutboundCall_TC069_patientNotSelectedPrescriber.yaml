appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC069 - Patient Not Selected Prescriber"
tags:
  - smart_scheduler
  - outbound_call
  - edge_case
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript: ../../../screens/Smart_Sch/PatientSelectionScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger scheduling with a prescriber to exercise patient selection gate
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Schedule with my prescriber"
- waitForAnimationToEnd

# Verify patient selection prompt is shown before proceeding
- assertVisible: "(?i).*(Who is this appointment for|Who is this visit for|select a patient|appointment.*for whom|who.*scheduling).*"
- takeScreenshot: SS_TC069_PatientNotSelected_Prescriber
