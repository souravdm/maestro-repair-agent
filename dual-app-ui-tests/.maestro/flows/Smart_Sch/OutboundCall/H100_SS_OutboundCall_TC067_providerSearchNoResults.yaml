appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC067 - Provider Search No Results"
tags:
  - smart_scheduler
  - outbound_call
  - provider_search
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Search for a provider name that will not exist in the directory
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Find a provider named XYZ123NonExistent"
- waitForAnimationToEnd

# Verify no-results error messaging is shown
- assertVisible: "(?i).*(couldn't find any providers|no providers.*found|Try different details|no results.*try again|no providers match).*"
- takeScreenshot: SS_TC067_ProviderSearch_NoResults
