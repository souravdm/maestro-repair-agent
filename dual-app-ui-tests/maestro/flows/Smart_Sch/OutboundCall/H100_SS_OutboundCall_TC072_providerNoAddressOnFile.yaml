appId: ${APP_ID}
name: "H100 | Smart Scheduler | Outbound Call | TC072 - Provider No Address On File"
tags:
  - smart_scheduler
  - outbound_call
  - provider_search
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/ProviderSearchScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger provider search; selected provider will have no address on file
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Schedule with a provider"
- waitForAnimationToEnd

# Verify that no-address error message is surfaced and user is offered an alternative
- assertVisible:
    text: "(?i).*(No address on file|no address.*provider|search for another provider|provider.*no address|address.*not found).*"
    optional: true
- takeScreenshot: SS_TC072_Provider_NoAddressOnFile
