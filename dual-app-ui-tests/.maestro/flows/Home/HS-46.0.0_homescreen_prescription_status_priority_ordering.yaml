# BUSINESS LOGIC: Prescription Status Priority Ordering (High Priority)
# Validates: Activity zone displays prescriptions in correct priority order
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Priority NBAs (Not filled, Delayed) appear first
#   - Action NBAs (Available for refill, Ready for pickup) appear second
#   - Discovery NBAs appear last
#   - Prescription count shows total (e.g., "3 prescriptions")
#   - Status mapping: Not filled → "Review and refill your Rx"
#   - Status mapping: Delayed → "Review order details"
#   - Status mapping: Ready for pickup → "Pickup at pharmacy"
# This test uses WERE_WORKING_ON_IT_NBA user with "Not filled" status to verify
# priority NBAs appear first with correct action text

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - prescription_status
    - priority_ordering
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WERE_WORKING_ON_IT_NBA
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- scrollUntilVisible:
      element:
          text: ${output.homescreen_activity.activityHeader}
      speed: 15
- assertVisible: ${output.homescreen_activity.anba_notFilled}
- assertVisible: ${output.homescreen_activity.subtext_reviewAndRefill}
