appId: ${APP_ID}
name: "H100 | Smart Scheduler | MinuteClinic Async | TC050 - Prescreen Q7"
tags:
  - smart_scheduler
  - mc_async
  - prescreen
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/MCAsyncScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger MC Async acne flow to reach medical history question
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "MinuteClinic async for acne"
- waitForAnimationToEnd

# Verify seventh prescreen question about prior diagnoses / medical history
- assertVisible: "(?i).*(ever been diagnosed.*conditions|diagnosed.*following|medical history|previously diagnosed).*"
- takeScreenshot: SS_TC050_MCAsync_PrescreenQ7_MedicalHistory
