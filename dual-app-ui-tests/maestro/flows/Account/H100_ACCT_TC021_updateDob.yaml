# Test: Update DOB
# Validates date of birth update on profile
# Source: Migrated from XCUITest EditProfileTests.testUpdateDOB

appId: ${APP_ID}
name: "H100 | Account | TC021 - Update Dob"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/editProfile.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/updateDob.yaml
