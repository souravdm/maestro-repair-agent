appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC174 - E2e Caregivee Virtual"
tags:
  - smart_scheduler
  - e2e
  - caregivee
  - modality_filter
  - virtual
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/PatientSelectionScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: ELIZABETH_MILLER
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# E2E caregivee + virtual — patient selection shown, then virtual options
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "My daughter needs a virtual visit for a rash"
- waitForAnimationToEnd

# Caregivee intent must trigger patient selection
- assertVisible: "(?i).*(select a patient|Who.*this.*for|which patient|choose.*patient|for whom).*"

- runFlow: ../../../subflows/Smart_Sch/patient/select-patient-caregivee.yaml
- waitForAnimationToEnd

# After patient selected, virtual options shown
- assertVisible: "(?i).*(virtual|telehealth|video.*visit|online.*visit).*"

- takeScreenshot: SS_TC174_E2E_Caregivee_Virtual
