appId: ${APP_ID}
name: "H100 | Smart Scheduler | Vaccine | TC037 - Age Eligibility"
tags:
  - smart_scheduler
  - vaccine
  - edge_case
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Request Shingrix (Shingles) vaccine for a 25-year-old (below the 50+ eligibility threshold)
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "Schedule a Shingrix vaccine for my 25-year-old"
- waitForAnimationToEnd

# System should surface an age eligibility check message
- assertVisible: "(?i).*(eligibility|age.*threshold|not eligible.*age|recommended for.*years|age.*requirement|minimum age|years.*older).*"

- takeScreenshot: SS_TC037_Vaccine_Age_Eligibility_Check
