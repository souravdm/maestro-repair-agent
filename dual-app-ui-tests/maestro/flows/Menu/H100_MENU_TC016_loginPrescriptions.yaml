appId: ${APP_ID}
name: "H100 | Menu | TC016 - Login Prescriptions"
tags:
  - home
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/SearchAndNav/searchNavObjects.js
---
# Flow: Menu navigation and verification for Prescriptions
- runFlow: ../../subflows/Common/launchAndSetup.yaml
- runScript:
    file: ../../config/credentials-loader.js
    env:
      loginData: DEAN_FANT
      BUILD_CONFIG: ${BUILD_CONFIG}
- runFlow:
    file: ../../subflows/Account/authentication/login.yaml

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml

- takeScreenshot: Menu_Pic
- scrollUntilVisible:
    element: ${output.explore_more_menu.prescriptionsBtn}
    speed: 40
- assertVisible: ${output.explore_more_menu.prescriptionsBtn}
- tapOn: ${output.explore_more_menu.prescriptionsBtn}
- waitForAnimationToEnd
- assertVisible: ${output.explore_more_menu.prescriptionsLabel}

- takeScreenshot: Test_complete

