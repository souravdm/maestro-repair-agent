# Subflow: Verify Managed Health Intent Response
# Validates HAIO responds with relevant clinical/wellness information
#
# Required env vars (must be passed by caller):
#   SCENARIO_NAME   - Unique name for screenshot (e.g., "Health_CareGap")
#   EXPECTED_KEYWORDS - Pipe-separated keywords to verify in bot response
appId: ${APP_ID}
onFlowStart:
  - runScript: ../../../screens/HAIO/ChatScreen.js
---

# Bot response already ready (send-message.yaml waited for typing indicator)
- waitForAnimationToEnd

# Capture chat screen BEFORE assertions for failure diagnosis
- takeScreenshot: HAIO_ManagedHealth_${SCENARIO_NAME}_Response

# Verify response contains health/wellness-relevant keywords
- assertVisible: "(?i).*(${EXPECTED_KEYWORDS}).*"

# Ensure no PHI leak — clinical data should stay within scope
- assertNotVisible: "(?i).*(ssn|social security|credit card|cvv).*"
