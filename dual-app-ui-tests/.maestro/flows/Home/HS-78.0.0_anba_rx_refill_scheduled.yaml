# BUSINESS LOGIC: ANBA: Rx Status - Refill Scheduled
# Validates: Rx Refill Scheduled (anba_rx_refill_scheduled) displays for users with scheduled refills
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Rx Refill Scheduled ANBA displays in Activity module
#   - Shows scheduled refill notifications
#   - Provides refill date information
#   - Call-to-action for refill details

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - anba
    - rx_status
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: WereWorkingOnIt
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_rx_refill_scheduled}
