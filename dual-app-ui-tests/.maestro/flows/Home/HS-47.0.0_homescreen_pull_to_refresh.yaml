# BUSINESS LOGIC: Pull-to-Refresh Functionality (Medium Priority)
# Validates: Pull-to-refresh updates homescreen content
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Swipe down refreshes homescreen content
#   - Loading indicator shows during refresh
#   - Content updates after refresh
#   - Error handling on refresh failure
# This test performs swipe down (pull-to-refresh gesture) and verifies
# that homescreen content remains visible and responsive after refresh

appId: ${APP_ID}
tags:
    - homescreen
    - medium_priority
    - pull_to_refresh
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- swipe:
      direction: down
- waitForAnimationToEnd
- swipe:
      direction: up
- waitForAnimationToEnd
- assertVisible: ${output.homescreen_activity.activityHeader}
