appId: ${APP_ID}
name: "H100 | Smart Scheduler | Counsel Health - Unregistered | TC087 - Reentry Button Persists"
tags:
  - smart_scheduler
  - counsel_health
  - navigation
  - positive
onFlowStart:
  - runScript: ../../../../screens/Common/CommonScreen.js
  - runScript: ../../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../../screens/Smart_Sch/CounselHealthScreen.js
  - runScript:
      file: ../../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Send message to trigger Counsel Health physician chat entry
- runFlow:
    file: ../../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want to chat with a physician"
- waitForAnimationToEnd

# Figma design note: 'Button should remain persistent to allow for re-entry into the Care Counsel flow.'
# Verify Counsel Health re-entry button is visible and persists after initial interaction
- assertVisible: "(?i).*(Chat with a physician|Continue to Counsel|Open Counsel|re-entry).*"

# Verify the button remains (not a transient element) - assert again with no optional flag
- assertVisible: "(?i).*(Chat with a physician|Continue to Counsel|Open Counsel|re-entry).*"

- takeScreenshot: SS_TC087_Reentry_Button
