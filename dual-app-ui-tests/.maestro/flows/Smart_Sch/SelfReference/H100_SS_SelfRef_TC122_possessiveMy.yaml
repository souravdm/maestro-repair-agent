appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC122 - Possessive My"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Possessive 'my' should resolve to self
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want to schedule my annual checkup"
- waitForAnimationToEnd

# No patient selection prompt for self
- assertNotVisible:
    text: "(?i).*(select a patient|Who is this.*for|which patient).*"
    optional: true

# Scheduling continues for self
- assertVisible: "(?i).*(What.*reason|checkup|annual|scheduling|How can I help|I can help).*"

- takeScreenshot: SS_TC122_Self_Ref_Possessive_My
