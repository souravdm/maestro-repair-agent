# BUSINESS LOGIC: Smoke Test: Homescreen No Internet Banner
# Validates: Error banner displays when internet connection is lost
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Show "Not connected to the internet" banner on network failure
#   - Error banner is dismissible
#   - App remains responsive
#   - Content is cached when possible

appId: ${APP_ID}
tags:
    - homescreen
    - ignore
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjectsH100.js
    - runScript: ../../screens/SearchAndNav/searchNavObjects.js
    - runScript: ../../screens/Account/OnboardingScreen.js
---
- runFlow: ../../subflows/Common/launchApp.yaml
- runFlow: ../../subflows/Account/onboarding/h100_continue_to_sign_options.yaml
- tapOn: ${output.account_health100_onboarding.continueAsAGuest}
- runFlow: ../../subflows/SearchAndNav/bottom_nav_loaded.yaml
- runScript:
    file: ../../config/network-toggle.js
    env:
        NETWORK_ACTION: block
- waitForAnimationToEnd
# Execute this assertion only on iOS
- runFlow:
    when:
      true: ${maestro.platform == 'ios'}
    commands:
      - extendedWaitUntil:
          visible: ${output.homescreen_error.notConnectedText}
          timeout: 20000
- runScript:
    file: ../../config/network-toggle.js
    env:
        NETWORK_ACTION: unblock
