appId: ${APP_ID}
name: "H100 | Menu | TC010 - View Benefits User"
tags:
  - home
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/SearchAndNav/searchNavObjects.js
---
# Flow: Menu navigation and verification in benefits user signed in flow
- runFlow: ../../subflows/Common/launchAndSetup.yaml
- runScript:
        file: ../../config/credentials-loader.js
        env:
          loginData: DEAN_FANT
          BUILD_CONFIG: ${BUILD_CONFIG}
- runFlow:
    file: ../../subflows/Account/authentication/login.yaml

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml
- runFlow: ../../subflows/Menu/navigateViaMenu.yaml

- takeScreenshot: Menu_Pic
- assertVisible: ${output.searchnav_bottom_benefits.claims}
- assertVisible: ${output.explore_more_menu.prescriptionsBtn}
- assertVisible: ${output.searchnav_bottom_benefits.benefits}
- assertVisible: ${output.menu_screen.healthRecordsLnk}
- assertVisible: ${output.explore_more_menu.scheduleCareBtn}
- assertVisible: ${output.explore_more_menu.drugPricingSmall}
- assertVisible: ${output.explore_more_menu.findPharmacy}
- assertVisible: ${output.explore_more_menu.findAProvider}
- assertVisible: ${output.explore_more_menu.rxOrdersBtn}
- swipe:
      direction: UP
- assertVisible: ${output.explore_more_menu.transferRxBtn}
- assertVisible: ${output.explore_more_menu.supportAndFAQBtn}
- assertVisible: ${output.explore_more_menu.termsAndPrivacyBtn}
- assertVisible: ${output.explore_more_menu.copyDeviceInf}
- takeScreenshot: Test_complete

