appId: ${APP_ID}
name: "H100 | Smart Scheduler | Modality | TC167 - Neg Virtual Unavailable For Condition"
tags:
  - smart_scheduler
  - modality_filter
  - nlp
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Surgery consultation not available virtually — system must inform and redirect
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I need a virtual visit for a surgery consultation"
- waitForAnimationToEnd

# System must inform user that surgery consultation requires in-person
- assertVisible: "(?i).*(not available.*virtual|require.*in-person|cannot.*virtually|surgery.*clinic|recommend.*in-person).*"

- takeScreenshot: SS_TC167_Modality_Neg_Virtual_Unavailable_Surgery
