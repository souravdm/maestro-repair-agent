# BUSINESS LOGIC: Smoke Test: Homescreen No Internet Banner
# Validates: Error banner displays when internet connection is lost
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Show "Not connected to the internet" banner on network failure
#   - Error banner is dismissible
#   - App remains responsive
#   - Content is cached when possible

appId: ${APP_ID}
tags:
    - homescreen
onFlowStart:
  - runScript: ../../screens/Account/accountObjects.js
  - runScript: ../../screens/Home/homescreenObjects.js
  - runScript: ../../screens/SearchAndNav/searchNavObjects.js
  - setAirplaneMode: enabled
onFlowComplete:
  - setAirplaneMode: disabled
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- tapOn: ${output.account_signIn.continueAsGuestBtn}
- runFlow: ../../subflows/SearchAndNav/bottom_nav_loaded.yaml
- assertVisible: ${output.homescreen_error.notConnectedText}
