# BUSINESS LOGIC: ANBA: Counsel Health Navigation
# Validates: User can navigate to Counsel Health from homescreen via anba_counsel_chat
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Counsel Health NBA displays
#   - Navigation to Counsel Health works
#   - Counsel Health screen loads
#   - Back navigation returns to homescreen

appId: ${APP_ID}
tags:
    - homescreen
    - ignore
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2_CAREGIVER
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow:
      file: ../../subflows/Home/click_anba_card.yaml
      env:
          ANBA_CARD: ${output.homescreen_activity.anba_messagePhysician}
- tapOn: ${output.homescreen_counsel.messagePhysicianBtn}
- runFlow: ../../subflows/Webview/counsel/validate_enrollment_landing.yaml