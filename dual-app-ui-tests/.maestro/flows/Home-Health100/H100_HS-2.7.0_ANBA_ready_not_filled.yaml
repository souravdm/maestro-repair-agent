# BUSINESS LOGIC: ANBA: Ready + Not Filled Carousel
# Validates: Both Ready and Not-Filled ANBA cards are present in the activity carousel
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Ready status NBA appears in carousel
#   - Not-Filled status NBA also present in carousel (swipe to see)
#   - Tap Ready card navigates to order details

appId: ${APP_ID}
tags:
    - homescreen
    - ignore
onFlowStart:
    - runScript: ../../screens/Home/homescreenObjectsH100.js
    - runScript:
          file: ../../config/credentials-loader.js
          env:
              loginData: ReadyNotFilledRx
---
- runFlow: ../../subflows/Common/launchApp.yaml
- runFlow: ../../subflows/Account/onboarding/h100_continue_to_sign_options.yaml
- runFlow: ../../subflows/Account/authentication/complete_signin_with_cvs_h100.yaml
- runFlow: ../../subflows/SearchAndNav/bottom_nav_loaded.yaml
- tapOn: ${output.searchnav_bottom.homeBtn}
- waitForAnimationToEnd
- runFlow: ../../subflows/Home/homescreen_loaded_successful_h100.yaml
- runFlow: ../../subflows/Home/activity_nba_loaded_h100.yaml
- runFlow:
    file: ../../subflows/Common/swipeShelfUntilVisible.yaml
    env:
      SHELF_TITLE: ${output.homescreen_activity.activityHeader}
      CARD_TEXT: ${output.homescreen_activity.anba_rx_ready}
- runFlow:
    file: ../../subflows/Common/swipeShelfUntilVisible.yaml
    env:
      SHELF_TITLE: ${output.homescreen_activity.activityHeader}
      CARD_TEXT: ${output.homescreen_activity.anba_rx_notrefilled}
- runFlow:
    file: ../../subflows/Home/click_anba_card.yaml
    env:
        ANBA_CARD: ${output.homescreen_activity.anba_rx_ready}
- runFlow: ../../subflows/Pharmacy/validate_order_details_ready.yaml
