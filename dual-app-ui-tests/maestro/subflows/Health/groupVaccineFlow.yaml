appId: ${APP_ID}
name: NGS Group Vaccine Scheduling
tags:
  - ngs
  - vaccine
  - group
---
# Subflow: launchApp
# Launch app (without clearState to avoid reinstall issues)
# Hardcoded app ID - same for all environments
- launchApp:
    appId: ${APP_ID}

# Handle first-time app launch sequence
# Based on XCUITest CommonSteps.waitForHomeTab() pattern

# Wait for app to fully load
- assertVisible: ".*"

# Handle onboarding flow if present
- runFlow:
    when:
      visible: ${account_onboarding.letsGetStartedBtn}
    commands:
      # Tap "Let's get started" button (first-time launch flow)
      - tapOn:
          text: ${account_onboarding.letsGetStartedBtn}

      # Wait for "Nice to see you!" screen
      - assertVisible: ${NICE_TO_SEE_YOU_MSG}

      # Tap Continue button on "Nice to see you!" screen
      - tapOn:
          text: "Continue"

# Handle notification permission prompt if present (system alert)
- runFlow:
    when:
      visible: ${NOTIFICATIONS_PROMPT}
    commands:
      - tapOn:
          text: ${DONT_ALLOW_BTN}

# Handle in-app "Yes, enable notifications" prompt if present
- runFlow:
    when:
      visible: ${ENABLE_NOTIFICATIONS_PROMPT}
    commands:
      - tapOn:
          text: "Not now"

# Handle location permission prompt if present (system alert)
- runFlow:
    when:
      visible: ${LOCATION_PROMPT}
    commands:
      - tapOn:
          text: ${DONT_ALLOW_BTN}

# Handle Bluetooth permission prompt if present (system alert)
- runFlow:
    when:
      visible: ${BLUETOOTH_PROMPT}
    commands:
      - tapOn:
          text: "OK"

# Handle any "Scan in Store" close button if present
# XCUITest: scanInStoreCloseImage with label "close"
- runFlow:
    when:
      visible:
        id: "close"
    commands:
      - tapOn:
          id: "close"

# Handle tip popover close button if present
- runFlow:
    when:
      visible:
        id: "xmark.circle.fill"
    commands:
      - tapOn:
          id: "xmark.circle.fill"

- runFlow:
    when:
      visible: ${EXPLORE_MORE_MSG}
    commands:
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn:
                text: "Close"
                index: 0
      - runFlow:
          when:
            visible:
              id: "xmark.circle.fill"
          commands:
            - tapOn:
                id: "xmark.circle.fill"

# Handle feedback/survey close button if present
- runFlow:
    when:
      visible: ${CLOSE_MESSAGE_BTN}
    commands:
      - tapOn:
          text: "Close Message"

# Wait for home screen to be fully loaded (bottom navigation visible)
- assertVisible: ${HOME_TAB}

# Subflow: startVaccineFlow
- tapOn: ${HOME_TAB}
- tapOn: ${VACCINES_LNK}
- assertVisible: ${FIND_CARE_TITLE}
- tapOn: ${SCHEDULE_VACCINATION_BTN}
- assertVisible: ${SCHEDULE_VACCINE_MSG}

- tapOn: "Schedule for Group"
- tapOn: "COVID-19"
- tapOn: "Next"
- assertVisible: "Add Family Members"
- tapOn: "Add Person"
- inputText: "John Doe"
- tapOn: "Next"
- assertVisible: "Eligibility"
- tapOn: "Next"
- assertVisible: "Location"
- inputText: "02895"
- tapOn: "Search"
- tapOn: "Schedule"
- assertVisible: "Group Appointment Scheduled"
