appId: ${APP_ID}
name: "H100 | Smart Scheduler | Self Reference | TC131 - Health Condition Context"
tags:
  - smart_scheduler
  - self_reference
  - nlp
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Medical condition owned by 'I' — should resolve to self
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I'm diabetic and need my quarterly checkup"
- waitForAnimationToEnd

- assertNotVisible:
    text: "(?i).*(select a patient|Who is this.*for|which patient).*"
    optional: true

- assertVisible: "(?i).*(checkup|clinic|schedule|I can help|What.*reason|appointment).*"

- takeScreenshot: SS_TC131_Self_Ref_Health_Condition
