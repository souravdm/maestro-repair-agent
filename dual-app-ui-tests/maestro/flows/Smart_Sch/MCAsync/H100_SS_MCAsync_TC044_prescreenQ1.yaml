appId: ${APP_ID}
name: "H100 | Smart Scheduler | MinuteClinic Async | TC044 - Prescreen Q1"
tags:
  - smart_scheduler
  - mc_async
  - prescreen
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Smart_Sch/MCAsyncScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml
- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Trigger MC Async acne prescreen flow
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want async care for acne"
- waitForAnimationToEnd

# Verify first prescreen question about symptoms is displayed
- assertVisible: "(?i).*(Are you experiencing any of the following symptoms|experiencing.*symptoms|following symptoms).*"
- takeScreenshot: SS_TC044_MCAsync_PrescreenQ1_Symptoms
