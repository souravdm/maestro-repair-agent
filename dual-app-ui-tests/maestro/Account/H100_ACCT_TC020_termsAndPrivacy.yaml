# Test: Terms and Privacy
# Validates terms and privacy page navigation
# Source: Migrated from XCUITest AccountTermsAndPrivacyTests

appId: ${APP_ID}
name: "H100 | Account | TC020 - Terms And Privacy"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

# Navigate to Terms & Privacy
- runScript: ../../screens/Account/AccountDashboardScreen.js
- scroll
- tapOn: ${output.account_dashboard.termsAndPrivacyButton}
- waitForAnimationToEnd

# Verify terms and privacy page
- runScript: ../../screens/Account/AccountTermsScreen.js
- assertVisible: ${output.account_terms.termsNavBar}
- assertVisible: ${output.account_terms.termsOfUseLink}
- assertVisible: ${output.account_terms.privacyPolicyLink}
