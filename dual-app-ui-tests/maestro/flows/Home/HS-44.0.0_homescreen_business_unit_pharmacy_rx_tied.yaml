# BUSINESS LOGIC: Pharmacy Business Unit for Rx-Tied Users (High Priority)
# Validates: Pharmacy module displays for Rx-tied users on Health & Pharmacy tab
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - "At the Pharmacy" module shows for Rx-tied users
#   - Module appears on Health & Pharmacy tab (not Shop tab)
#   - Displays prescription management options: View all prescriptions, Review Rx orders
#   - User segment "user + rxtie" receives pharmacy module from PE
#   - Correct ranking and order of content cards
# This test verifies that Rx-tied user (LOA2) sees pharmacy module with correct actions

appId: ${APP_ID}
tags:
    - homescreen
    - high_priority
    - business_units
    - pharmacy
    - rx_tied
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- tapOn: ${output.homescreen_splitview.tab_health_and_pharmacy}
- waitForAnimationToEnd
- scrollUntilVisible:
      element:
          text: ${output.homescreen_pharmacy.header}
      speed: 15
- assertVisible: ${output.homescreen_pharmacy.header}
- assertVisible: ${output.homescreen_pharmacy.viewAllPrescriptions}
