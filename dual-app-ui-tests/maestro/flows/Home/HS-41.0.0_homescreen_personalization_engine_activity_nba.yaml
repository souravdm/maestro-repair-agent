# BUSINESS LOGIC: Personalization Engine Activity NBA Integration (Critical Requirement)
# Validates: Activity zone displays based on user's prescription/appointment status from PE
# -------------------------------------------------
# Requirements from docs/maestro/features/homescreen.md:
#   - Activity NBAs returned from Personalization Engine API endpoint
#   - User segment (LOA2) determines which NBAs are returned
#   - Activity zone displays for authenticated users with Rx data
#   - Content is personalized based on user's health data and prescriptions
# This test ensures the PE integration correctly returns and displays Activity NBAs

appId: ${APP_ID}
tags:
    - homescreen
    - critical
    - personalization_engine
    - business_logic
onFlowStart:
    - runScript: ../../screens/Account/accountObjects.js
    - runScript: ../../screens/Home/homescreenObjects.js
    - runScript:
          file: ../../testdata/users_qa.js
          env:
              loginData: LOA2
---
- runFlow: ../../subflows/Common/launchApp.yaml
- tapOn: ${output.account_onboarding.letsGetStartedBtn}
- runFlow: ../../subflows/Account/complete_signin_and_otp_dob.yaml
- runFlow: ../../subflows/Home/homescreen_loaded_successful.yaml
- assertVisible: ${output.homescreen_activity.activityHeader}
- scrollUntilVisible:
      element:
          text: ${output.homescreen_activity.activityHeader}
      speed: 15
