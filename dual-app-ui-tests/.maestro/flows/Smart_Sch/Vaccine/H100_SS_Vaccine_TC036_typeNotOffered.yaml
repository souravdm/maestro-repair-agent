appId: ${APP_ID}
name: "H100 | Smart Scheduler | Vaccine | TC036 - Type Not Offered"
tags:
  - smart_scheduler
  - vaccine
  - negative
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Request a vaccine type that is not in the CVS formulary
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want an experimental vaccine at CVS"
- waitForAnimationToEnd

# System should surface a not-available message for the unsupported vaccine type
- assertVisible: "(?i).*(not available.*vaccine|this vaccine.*not offered|try a different|not.*offer.*vaccine|vaccine.*not.*available).*"

- takeScreenshot: SS_TC036_Vaccine_Type_Not_Offered
