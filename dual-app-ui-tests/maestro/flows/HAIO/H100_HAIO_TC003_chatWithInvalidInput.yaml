appId: ${APP_ID}
name: "H100 | HAIO | TC003 - Chat With Invalid Input"
tags:
  - haio
  - chat
  - negative
  - error-handling
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
# =============================================================================
# NEGATIVE TEST: Test error handling with invalid/empty input
# User Journey: Login -> Open HAIO -> Send invalid input -> Verify error handling
# =============================================================================

- runFlow:
    file: ../../subflows/Common/launchApp.yaml
- runFlow:
    file: ../../subflows/Account/onboarding/h100_continue_to_sign_options.yaml
- runFlow:
    file: ../../subflows/Account/authentication/complete_signin_with_cvs_h100.yaml

# Navigate to HAIO
- runFlow: ../../subflows/HAIO/navigation/navigate-to-haio.yaml

# Load screen objects
- runScript: ../../screens/HAIO/HomeScreen.js
- runScript: ../../screens/HAIO/ChatScreen.js

# Test 1: Try to send empty message
- tapOn: ${output.haio_home.chatInputField}
- waitForAnimationToEnd

# Verify send button is disabled or not visible for empty input
# (This assertion may fail if app allows empty messages - that's the test)
- tapOn:
    text: ${output.haio_chat.sendBtn}

# Verify no response is shown (or error message appears)
- assertNotVisible: ${output.haio_chat.recentVisitsHeading}

# Test 2: Send extremely long message
- tapOn: ${output.haio_home.chatInputField}
- inputText: "This is an extremely long message that might exceed character limits or cause issues with the AI assistant processing. Adding more text to make this really long and potentially problematic for the system to handle properly without any meaningful content just to test edge cases and error handling capabilities of the Health AI Assistant interface and backend systems."

# Try to send
- tapOn: ${output.haio_chat.sendBtn}
- waitForAnimationToEnd

# Verify either:
# 1. Response is received (system handles long input gracefully)
# 2. Error message is shown
# 3. Input is truncated
- extendedWaitUntil:
    visible: "(?i).*(can't help|assist you|health concerns|cannot|As a|Assistant|assistant|Health|health).*"
    timeout: 20000

# Test 3: Send special characters only
- tapOn: ${output.haio_home.chatInputField}
- inputText: "!@#$%^&*()_+-=[]{}|;:',.<>?/~`"
- tapOn: ${output.haio_chat.sendBtn}
- waitForAnimationToEnd

# Verify error handling or graceful response
- extendedWaitUntil:
    visible: "(?i).*(unusual|input|can't|characters|cannot|Assistant|assistant|Health|health).*"
    timeout: 18000

# Wait for AI to finish generating the test 3 response before test 4.
# The extendedWaitUntil above exits as soon as the pattern matches, which may be mid-animation.
# Waiting for "Send Message" to be visible guarantees the AI stopped generating and the input is ready.
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "${output.haio_chat.sendBtn}"
    timeout: 25000
    optional: true

# Test 4: Ask out-of-scope question (weather)
# Re-navigate to HAIO only if the chat session closed during tests 1-3
# (endChatBtn visible = still in chat; not visible = returned to homescreen)
- runFlow:
    when:
      notVisible: ${output.haio_chat.endChatBtn}
    commands:
      - runFlow: ../../subflows/HAIO/navigation/navigate-to-haio.yaml
- tapOn: ${output.haio_home.chatInputField}
- inputText: "What's the weather today?"
- tapOn: ${output.haio_chat.sendBtn}
- waitForAnimationToEnd

# Verify the complete expected response
- assertVisible: "(?i).*(can't help|assist you|health concerns|cannot|Assistant|assistant|Health|health).*"
- takeScreenshot: Test_Complete
