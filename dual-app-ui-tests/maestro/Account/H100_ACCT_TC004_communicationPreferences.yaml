# Test: Communication Preferences
# Validates communication preferences management
# Source: Migrated from XCUITest CommunicationPrefsTests

appId: ${APP_ID}
name: "H100 | Account | TC004 - Communication Preferences"
tags:
  - account
  - regression
  - migrated-xcuitest
onFlowStart:
  - runScript: ../../screens/Common/CommonScreen.js
  - runScript:
      file: ../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd

- runFlow:
    file: ../../subflows/Common/launchAndSetup.yaml

- runFlow:
    file: ../../subflows/Account/authentication/login.yaml
    env:
      loginData: "LOA2"

- runFlow:
    file: ../../subflows/Common/dismissOverlays.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/navigateToAccountDashboard.yaml

- runFlow:
    file: ../../subflows/Account/dashboard/communicationPrefs.yaml

- runScript: ../../screens/Account/CommunicationPrefsScreen.js
- assertVisible: ${output.account_communicationPrefs.communicationPrefsNavBar}
