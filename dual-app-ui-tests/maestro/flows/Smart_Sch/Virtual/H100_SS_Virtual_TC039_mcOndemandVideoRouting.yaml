appId: ${APP_ID}
name: "H100 | Smart Scheduler | Virtual | TC039 - Mc Ondemand Video Routing"
tags:
  - smart_scheduler
  - virtual
  - positive
onFlowStart:
  - runScript: ../../../screens/Common/CommonScreen.js
  - runScript: ../../../screens/HAIO/HealthAIHomeScreen.js
  - runScript: ../../../screens/HAIO/ChatScreen.js
  - runScript: ../../../screens/Smart_Sch/SmartSchedulerScreen.js
  - runScript: ../../../screens/Health/VirtualMedicineScreen.js
  - runScript:
      file: ../../../config/credentials-loader.js
      env:
        loginData: LOA2
        BUILD_CONFIG: ${BUILD_CONFIG}
---
- waitForAnimationToEnd
- runFlow: ../../../subflows/Common/launchAndSetup.yaml
- runFlow: ../../../subflows/Account/authentication/login.yaml

# Handle optional permission overlay
- runFlow:
    when:
      visible: "Allow Notifications"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- runFlow: ../../../subflows/HAIO/navigation/navigate-to-haio.yaml
- waitForAnimationToEnd

# Request MinuteClinic on-demand video visit specifically
- runFlow:
    file: ../../../subflows/HAIO/interactions/send-message.yaml
    env:
      MESSAGE: "I want a MinuteClinic on-demand video visit"
- waitForAnimationToEnd

# System should route to MC on-demand video flow
- assertVisible: "(?i).*(on-demand|video.*MinuteClinic|MinuteClinic.*video|video.*visit.*MinuteClinic|on demand.*video).*"

- takeScreenshot: SS_TC039_MC_OnDemand_Video_Routing
